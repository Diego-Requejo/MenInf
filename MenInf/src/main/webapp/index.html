<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MenInf - Descubre tu camino</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="./img/Logotipo.png">
    </head>

    <body>
        <div class="popup" id="popup">
            <div id="contenido-popup"></div>
        </div>
        <header>
            <div class="icono" >
                <a href="./index.html">
                <img src="./img/Logotipo.png" alt="logo" >
                </a>
                <span>MenInf - Descubre tu camino</span>
            </div>

            <div class="icono" id="usuario">
                <img src="./img/Usuario.png" alt="usuario">
            </div>
        </header>


        <section class="banner-caja">

            <div class="banner">

                <h1 class="titulo">Descubre tu ✨DESTINO✨</h1>

                <p>
                    Rellena el cuestionario para descubrir la mejor mención para ti
                </p>

                <button class="boton-formulario requiere-sesion" data-href="formulario.jsp">
                    ¡Empieza aquí!
                </button>

            </div>


            <div class="opciones">
                <a href="./horario.jsp">
                <div class="horarioP">

                    <div class="horario-img">

                        <img src="./img/Horario.png" alt="horario">

                    </div>

                    <h3>Horario</h3>

                </div>
                </a>


                <div class="divisor"></div>

                <a href="MostrarProgreso" class="requiere-sesion">
                <div class="progreso">

                    <div class="progreso-img">
                        <img src="./img/Progreso.png" alt="progreso">
                    </div>

                    <h3>Progreso</h3>

                </div>
                </a>

            </div>

        </section>


        <footer>
            <span>Proyecto de SSW</span>
            <span>-</span>
            <span>Desarrollado por: Carlos, Diego, Elisa, Orestes</span>
        </footer>

        <script src="./js/popup.js"></script>
    </body>
</html>
