<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MenInf - Descubre tu camino</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="icono">
        <img src="../resources/img/Logotipo.png" alt="logo">
        <span>MenInf - Descubre tu camino</span>
    </div>

    <div class="icono">
        <img src="http://localhost:8080/MenInf/src/main/resources/img/Usuario.png" alt="usuario">
    </div>
</header>


<section class="banner-caja">

    <div class="banner">

        <h1 class="titulo">Descubre tu ✨DESTINO✨</h1>

        <p>
            Rellena el cuestionario para descubrir la mejor mención para ti
        </p>

        <button class="boton-formulario">
            ¡Empieza aquí!
        </button>

    </div>


    <div class="opciones">

        <div class="horario">

            <div class="horario-img">
                <img src="../resources/img/Horario.png" alt="horario">
            </div>

            <h3>Horario</h3>

        </div>


        <div class="divisor"></div>


        <div class="progreso">

            <div class="progreso-img">
                <img src="../resources/img/Progreso.png" alt="progreso">
            </div>

            <h3 class="titulo1">Progreso</h3>

        </div>

    </div>

</section>


<footer>
    <span>Proyecto de SSW</span>
    <span>-</span>
    <span>Desarrollado por: Carlos, Diego, Elisa, Orestes</span>
</footer>

</body>
</html>
