<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Popup iniciar sesion</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="popup">

        <span>Iniciar sesión</span>
        <div class="cerrar">X</div>

    <label>Nombre de usuario:</label>

    <button class="boton-enviar">Enviar</button>
</div>

</body>
</html>
